testimonials:
  enable: false
  items:
    - quote: >
              Je suis arrivée avec un deck de 30 slides. Je suis repartie avec une seule question
              à poser à mes dix premiers clients. Ça a tout changé.
      author: "Léa · fondatrice, solution RH pour PME"
    - quote: >
              On m'a dit d'arrêter de construire et d'aller vendre. Trois semaines plus tard
              j'avais mon premier contrat.
      author: "Marc · agritech, Martigny"
    - quote: >
              Pas de langue de bois. Les mentors ont testé mon idée comme de vrais clients
              l'auraient fait. Exactement ce dont j'avais besoin.
      author: "Sami · app de réservation pour artisans"

faq:
  title: "Questions fréquentes"
  items:
    - question: "Combien ça coûte ?"
      answer: >
              Le conseil est gratuit : les mentors sont bénévoles. Chacun règle son propre repas
              au restaurant. On vous demande juste d'être à l'heure et de venir préparé.
    - question: "Faut-il déjà avoir une entreprise ?"
      answer: >
              Non. Une idée sérieuse suffit. Beaucoup de nos meilleurs repas ont lieu avant la
              création de la société.
    - question: "Comment choisissez-vous les mentors ?"
      answer: >
              On lit vos réponses et on compose un duo dont les expériences se complètent et
              collent à vos défis. Deux regards valent mieux qu'un : ça évite les angles morts.
    - question: "Où exactement à Fully ?"
      answer: >
              Dans un restaurant partenaire au centre du village. L'adresse précise vous est
              envoyée avec la confirmation.
    - question: "Puis-je revenir ?"
      answer: >
              Oui. Un repas par mois maximum par projet, pour laisser la place aux autres.
              Beaucoup de fondateurs reviennent trois mois plus tard pour faire le point.

booking:
  title: "Réserver un repas"
  intro: >
          Parlez-nous de votre projet, puis choisissez votre vendredi. On confirme par e-mail
