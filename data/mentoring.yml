hero:
  badge: "Fully, Valais · tous les vendredis midi"
  title: "Un repas, deux mentors, <em>des pistes</em> pour votre projet."
  intro: >
          Entreprendre seul est dur. Deux mentors qui l'ont déjà vécu partagent leur table et
          leur expérience : des conseils bienveillants, désintéressés et applicables pour passer
          de zéro à un à l'ère de l'IA.
  ctaPrimary: "Réserver mon repas"
  ctaSecondary: "Voir comment ça marche"
  card:
    day: "Vendredi"
    time: "12h15"
    lines:
      - "1 entrepreneur"
      - "2 mentors"
      - "1 h 30"
    tagPrimary: "Conseils gratuits"
    tagSecondary: "Sans engagement"

principles:
  - title: "Bienveillants."
    text: >
            Pas de pitch, pas de jury. Quand on avance seul, on manque de regards extérieurs.
            Deux personnes qui ont connu vos doutes vous écoutent d'abord, puis vous parlent
            franchement.
  - title: "Désintéressés."
    text: >
            Les mentors ne vendent rien, n'investissent pas et n'attendent rien en retour.
            Leur seul intérêt : que votre projet avance.
  - title: "Applicables."
    text: >
            Pas de théorie. Des pistes concrètes à tester dès lundi : premiers clients, prix,
            quoi construire en premier, et ce que l'IA change vraiment pour vous.

steps:
  title: "Comment ça marche"
  subtitle: "Trois étapes, zéro paperasse."
  items:
    - number: "1"
      title: "Vous nous parlez de votre projet"
      text: >
              Un court formulaire : où vous en êtes, ce qui vous bloque. Cinq minutes, pas plus.
    - number: "2"
      title: "On vous associe à deux mentors"
      text: >
              Selon votre secteur et vos défis, vous choisissez un vendredi. On s'occupe de la table.
    - number: "3"
      title: "Vous déjeunez, vous repartez avec des pistes"
      highlight: true
      text: >
              1 h 30 à Fully, à trois autour d'une table. Vous repartez avec deux ou trois pistes
              concrètes à explorer dans la semaine.

